<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  var msgs = document.getElementById('acMsgs');
  var input = document.getElementById('acInput');
  var sendBtn = document.getElementById('acSend');
  var imgInput = document.getElementById('acImgInput');

  // 知识库预置回复
  var KB = [
    { k: ['圆肩', '驼背'], a: '圆肩驼背改善建议：\n1）胸肌放松：门框拉伸，每侧30秒×3组；\n2）背部强化：YTW字母操、俯身W夹背，每天2组；\n3）胸椎灵活性：泡沫轴滚胸椎、猫式伸展；\n4）日常习惯：屏幕抬高至视线水平，每小时起身活动。坚持4周以上可见明显改善。' },
    { k: ['骨盆前倾'], a: '骨盆前倾矫正动作推荐：\n1）90/90呼吸训练：激活深层腹横肌，5分钟；\n2）死虫式：3组×每侧10次；\n3）臀桥：3组×15次，强化臀肌；\n4）跪姿髂腰肌拉伸：每侧45秒，放松紧张的髋前侧。\n同时注意站立时收腹卷尾骨，避免久坐。' },
    { k: ['居家', '注意'], a: '居家训练注意事项：\n1）训练前动态热身5-10分钟，激活关节；\n2）保证动作质量优先于次数，宁少勿假；\n3）地面防滑、周围留出安全空间；\n4）循序渐进增加强度，每周增幅不超过10%；\n5）训练后进行静态拉伸与补水。如出现关节疼痛立即停止。' },
    { k: ['酸痛'], a: '训练后肌肉酸痛多为延迟性肌肉酸痛（DOMS），属正常现象，通常24-72小时自行缓解。\n缓解建议：轻度活动（散步、拉伸）、充足睡眠、补充蛋白质与水分。\n但若出现尖锐疼痛、关节肿胀或持续超过5天，可能是损伤信号，建议就医检查。' },
    { k: ['饮食', '营养', '吃'], a: '训练期饮食建议：\n1）训练前1-2小时：适量碳水+少量蛋白（如香蕉+酸奶）；\n2）训练后30-60分钟：蛋白质20-30g+碳水（如鸡蛋、鸡胸肉+米饭）；\n3）每日饮水1.5-2L，训练日适当增加；\n4）减脂期控制总热量但保证蛋白质摄入，避免极端节食。' },
    { k: ['睡眠', '作息', '休息'], a: '作息对训练恢复至关重要：\n1）保证每晚7-9小时睡眠，肌肉修复主要发生在深度睡眠期；\n2）尽量固定入睡与起床时间；\n3）睡前1小时避免强光与剧烈运动；\n4）大强度训练日可安排午休20-30分钟辅助恢复。' }
  ];
  var FALLBACK = '根据运动健康知识库：建议先进行一次AI体态检测明确问题，再针对性选择训练项目。日常保持规律训练、均衡饮食与充足睡眠。你可以点击左侧快捷问题，或描述更具体的情况（如训练目标、不适部位），我会给出更精准的建议。';

  function bubble(role, html) {
    var div = document.createElement('div');
    div.className = 'ac-msg ' + role;
    div.innerHTML = '<span class="ac-ava">' + (role === 'ai' ? 'AI' : '我') + '</span>' +
      '<div class="ac-bubble">' + html +
      (role === 'ai' ? '<div class="ac-src">来源：运动健康知识库</div>' : '') +
      '</div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div.querySelector('.ac-bubble');
  }

  function reply(question) {
    var typing = bubble('ai', '<span class="ac-typing"><i></i><i></i><i></i></span>');
    typing.querySelector('.ac-src').style.display = 'none';
    var text = FALLBACK;
    for (var i = 0; i < KB.length; i++) {
      for (var j = 0; j < KB[i].k.length; j++) {
        if (question.indexOf(KB[i].k[j]) > -1) { text = KB[i].a; break; }
      }
    }
    setTimeout(function () {
      typing.innerHTML = text.replace(/\n/g, '<br>') + '<div class="ac-src">来源：运动健康知识库</div>';
      msgs.scrollTop = msgs.scrollHeight;
    }, 900);
  }

  function ask(text) {
    if (!text) return;
    bubble('user', text);
    input.value = '';
    reply(text);
  }

  sendBtn.addEventListener('click', function () { ask(input.value.trim()); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') ask(input.value.trim()); });

  // 快捷问题
  document.getElementById('acQuick').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) ask(b.dataset.q);
  });

  // 功能标签切换
  document.getElementById('acCats').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('is-on'); });
    b.classList.add('is-on');
  });

  // 图片提问
  imgInput.addEventListener('change', function () {
    var f = imgInput.files && imgInput.files[0];
    if (!f) return;
    bubble('user', '<div>请帮我看看这个动作标准吗？</div><img src="' + URL.createObjectURL(f) + '" alt="上传的动作照片">');
    setTimeout(function () {
      var b = bubble('ai', '<span class="ac-typing"><i></i><i></i><i></i></span>');
      setTimeout(function () {
        b.innerHTML = '已收到你的动作照片。基于骨骼关键点对比分析：整体动作模式基本标准，建议注意发力时核心收紧、避免代偿。可前往<a href="programs.html" style="color:#ff8f75">训练项目</a>查看对应纠正训练。<div class="ac-src">来源：运动健康知识库</div>';
        msgs.scrollTop = msgs.scrollHeight;
      }, 1200);
    }, 300);
    imgInput.value = '';
  });
})();
</script>
